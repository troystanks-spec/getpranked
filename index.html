<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barry Hub Tabs</title>
<style>
  body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
    margin: 0;
  }
  header {
    background: #1e293b;
    padding: 14px 20px;
    text-align: center;
    font-size: 1.4rem;
    font-weight: bold;
  }
  .tabs {
    display: flex;
    background: #1e293b;
    border-bottom: 2px solid #334155;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    background: #1e293b;
    color: #94a3b8;
    transition: background 0.2s;
  }
  .tab:hover {
    background: #334155;
    color: #fff;
  }
  .tab.active {
    background: #475569;
    color: #fff;
    font-weight: bold;
  }
  .content {
    padding: 20px;
  }
  iframe {
    width: 100%;
    height: 80vh;
    border: none;
    border-radius: 8px;
  }
</style>
</head>
<body>

<header>Barry’s Learning Hub</header>

<div class="tabs">
  <div class="tab active" data-target="tab1">Tab 1</div>
  <div class="tab" data-target="tab2">Tab 2</div>
  <div class="tab" data-target="tab3">Tab 3</div>
</div>

<div class="content">
  <!-- Tab 1 -->
  <div id="tab1" class="tab-content" style="display:block;">
    <h2>LearningHubSpace Example</h2>
    <iframe src="https://learninghubspace.top/" title="LearningHubSpace"></iframe>
  </div>

  <!-- Tab 2 -->
  <div id="tab2" class="tab-content" style="display:none;">
    <h2>DuckMath Games</h2>
    <iframe src="https://play.duckmath.games/onboarding" title="DuckMath Games"></iframe>
  </div>

  <!-- Tab 3 -->
  <div id="tab3" class="tab-content" style="display:none;">
    <h2>Cookie Clicker</h2>
    <iframe src="https://orteil.dashnet.org/cookieclicker/" title="Cookie Clicker"></iframe>
  </div>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const contents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      contents.forEach(c => c.style.display = 'none');
      document.getElementById(tab.dataset.target).style.display = 'block';
    });
  });
</script>

</body>
</html>
